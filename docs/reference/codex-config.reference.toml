# ---------------------------------------------------------------------------
# ~/.codex/config.toml の手書き設定リファレンス
#
# このファイルは chezmoi の管理対象ではありません。展開もされません。
# Codex CLI 自身が config.toml を書き戻すため（信頼済みプロジェクト一覧、
# MCP サーバの絶対パス、プラグイン登録、デスクトップのテーマなど）、
# chezmoi で管理するとそれらが apply のたびに消えます。
# 詳細は docs/MANAGED_FILES.md を参照してください。
#
# 新しい PC では、Codex CLI が生成した config.toml に対して
# 以下の「手書き相当」の値だけを手で設定してください。
# 絶対パスやマシン固有 ID は意図的に含めていません。
# ---------------------------------------------------------------------------

model = "gpt-5.6-sol"
model_reasoning_effort = "low"
service_tier = "priority"

[features]
js_repl = false

[windows]
sandbox = "elevated"

# 個人スクリプト / 信頼済みディレクトリ向けのプロファイル。
# 使い方: codex -p vault
[profiles.vault]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# ---------------------------------------------------------------------------
# 意図的に載せていないもの（Codex CLI が自動生成・マシン固有）
#
#   notify                     インストール先の絶対パス
#   [projects.'<path>']        信頼済みプロジェクトの一覧
#   [mcp_servers.*]            ランタイムの絶対パスとバージョン
#   [marketplaces.*]           取得日時つきのマーケットプレイス登録
#   [plugins.*]                プラグイン有効/無効の状態
#   [tui.*], [desktop.*]       UI の状態とテーマ
#   [shell_environment_policy] ランタイムが差し込む環境変数
# ---------------------------------------------------------------------------
